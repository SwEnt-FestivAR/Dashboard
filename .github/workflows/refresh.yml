# Rebuilds the dashboard every 2 hours, except at night (01:30-07:30) and from Thursday 00:00 to Friday 11:00,
# Swiss time (summer time included).
# GitHub delays or drops `schedule` runs (often down to one a day), so the rhythm does not rely on cron:
# each run waits 2 hours, starts deploy.yml, then starts itself again. GITHUB_TOKEN may trigger workflow_dispatch
# (unlike most events), so no secret is needed. The sleeping job costs Actions minutes, which are free on a public repo,
# but it holds one of the organization's runners, which FestivAR's CI also uses.
# That is why the loop stops completely during the weekly pause (no job waiting); the Friday crons start it again.
# Exactly one loop is alive at a time: with cancel-in-progress off, the group keeps one running run and one pending,
# and a newer pending run replaces the older one. So pushes and crons never reset the timer of a running loop
# (they end up cancelled while queued), and they revive the loop if it stopped (pause, failed dispatch, GitHub outage).
name: Refresh every 2 hours

on:
  push:
    branches: [main] # restarts the loop if needed; deploy.yml builds right away on its own
  schedule:
    - cron: '17 6,12,18 * * *' # restarters only, any of them may be dropped
    - cron: '17 10,11,13,15 * * 5' # Friday, end of the weekly pause (11:17 Swiss time in winter, 12:17 in summer)
  workflow_dispatch:

permissions:
  actions: write # start deploy.yml and this workflow

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 135
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Succeeds from Thursday 00:00 to Friday 11:00, Swiss time (date +%u: 4 = Thursday, 5 = Friday)
      IN_WEEKLY_PAUSE: >-
        d=$(TZ=Europe/Zurich date +%u); t=$((10#$(TZ=Europe/Zurich date +%H%M)));
        [ "$d" = 4 ] || { [ "$d" = 5 ] && [ "$t" -lt 1100 ]; }
    steps:
      - name: Wait 2 hours, unless the weekly pause has started
        run: eval "$IN_WEEKLY_PAUSE" || sleep 7200

      - name: Rebuild, unless it is night or the weekly pause
        id: build
        run: |
          if eval "$IN_WEEKLY_PAUSE"; then
            echo "Weekly pause: no build, the loop stops until Friday 11:00"
            echo "stop=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          now=$((10#$(TZ=Europe/Zurich date +%H%M)))  # e.g. 0745 -> 745
          if [ "$now" -ge 130 ] && [ "$now" -lt 730 ]; then
            echo "Quiet hours, no build"
          else
            gh workflow run deploy.yml --ref main
          fi

      - name: Start the next tick
        # Keeps the loop alive after a failed dispatch, but not during the weekly pause or when the run was cancelled
        if: (success() || failure()) && steps.build.outputs.stop != 'true'
        run: gh workflow run refresh.yml --ref main
