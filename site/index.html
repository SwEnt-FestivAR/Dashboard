<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FestivAR Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎪</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <!-- ES modules: the site must be served over HTTP (scripts/serve.mjs locally), not opened as a file. -->
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🎪</span>
      <div>
        <h1>FestivAR Dashboard</h1>
        <a id="repoLink" class="muted small" target="_blank" rel="noopener"></a>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
    <div class="topbar-right">
      <span id="updated" class="muted small"></span>
      <button id="themeBtn" class="icon-btn" title="Toggle theme">◐</button>
    </div>
  </header>

  <!-- Filled by js/main.js with one <section> per tab of js/tabs/index.js -->
  <main id="main">
    <div id="loading" class="loading">Loading data…</div>
  </main>
</body>
</html>
